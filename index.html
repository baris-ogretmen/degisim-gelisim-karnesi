<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Değişim Koleji · Öğrenci Değişim Karnesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{--ana:#1e3a5f;--altin:#b8893b;--krem:#f6f1e6;--zemin:#f3f5f9;--yazi:#1e293b;--soluk:#64748b;--cizgi:#e2e8f0;--yesil:#15803d;--turuncu:#c2410c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--zemin);color:var(--yazi);font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
#app{max-width:1150px;margin:0 auto;padding:0 14px 90px}

/* Üst çubuk */
.ust{position:sticky;top:0;z-index:50;background:rgba(243,245,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--cizgi);margin:0 -14px 16px;padding:10px 14px 0}
.ustSatir{display:flex;align-items:center;gap:10px}
.logoMini{width:38px;height:38px;flex:none}
.ustBaslik{flex:1;min-width:0}
.ustBaslik b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:19px;color:var(--ana);line-height:1.1}
.ustBaslik span{font-size:12px;color:var(--soluk)}
.ikonBtn{border:1px solid var(--cizgi);background:#fff;border-radius:12px;width:40px;height:40px;font-size:18px;display:grid;place-items:center;flex:none}
.sekmeler{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.sekmeler::-webkit-scrollbar{display:none}
@media(max-width:700px){.sekmeler{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:30px}}
.sekme{border:0;background:transparent;padding:10px 14px;font-size:14.5px;font-weight:600;color:var(--soluk);border-bottom:3px solid transparent;white-space:nowrap}
.sekme.aktif{color:var(--ana);border-bottom-color:var(--altin)}

/* Kartlar */
.kart{background:#fff;border:1px solid var(--cizgi);border-radius:16px;padding:18px;margin-bottom:14px}
.kart h2{margin:0 0 4px;font-size:18px;color:var(--ana)}
.kart h3{margin:0 0 10px;font-size:15.5px;color:var(--ana)}
.aciklama{color:var(--soluk);font-size:13.5px;margin:0 0 12px;line-height:1.5}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:600;font-size:14.5px;background:var(--ana);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.altin{background:var(--altin)}
.btn.acik{background:#eef2f7;color:var(--ana)}
.btn.cizgili{background:#fff;color:var(--ana);border:1px solid var(--cizgi)}
.btn.kirmizi{background:#fee2e2;color:#b91c1c}
.btn.kucuk{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.satir{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alan{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;flex:1;min-width:170px}
.alan label{font-size:12.5px;font-weight:600;color:var(--soluk)}
.alan input,.alan select,.alan textarea,.gir{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;width:100%;color:var(--yazi)}
.alan input:focus,.alan textarea:focus,.gir:focus,textarea:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{border:1px solid var(--cizgi);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--yazi)}
.cip.aktif{background:var(--ana);color:#fff;border-color:var(--ana)}
.cip .say{font-weight:500;opacity:.7;margin-left:4px}
.bos{text-align:center;color:var(--soluk);padding:26px 10px}
.bos .buyuk{font-size:40px}
.ipucu{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.ilerleme{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.ilerleme i{display:block;height:100%;background:linear-gradient(90deg,var(--altin),#d6a85a);border-radius:99px;transition:width .3s}

/* Kadro & öğrenci tabloları */
.tablo{width:100%;border-collapse:collapse;font-size:14px}
.tablo td,.tablo th{padding:7px 6px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:middle}
.tablo th{font-size:12px;color:var(--soluk);font-weight:600}
.tablo input{border:1px solid transparent;background:transparent;padding:7px 8px;border-radius:8px;width:100%}
.tablo input:hover{border-color:var(--cizgi)}
.tablo input:focus{border-color:#60a5fa;background:#fff;outline:none}
.sil{border:0;background:transparent;color:#94a3b8;font-size:17px;padding:4px 8px;border-radius:8px}
.sil:hover{background:#fee2e2;color:#b91c1c}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.iki{grid-template-columns:1fr}}
.karneDuzen{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.karneDuzen{grid-template-columns:minmax(0,1fr)}}

/* Görüş yazma */
.ogrKart{background:#fff;border:1px solid var(--cizgi);border-radius:16px;padding:14px;margin-bottom:12px;transition:border-color .2s}
.ogrKart.tamam{border-color:#86efac;box-shadow:inset 4px 0 0 #22c55e}
.ogrUst{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ogrNo{background:var(--krem);color:var(--ana);font-weight:700;font-size:12.5px;border-radius:8px;padding:4px 8px;min-width:38px;text-align:center}
.ogrAd{font-weight:700;font-size:16px;flex:1}
.durum{font-size:12.5px;color:var(--soluk)}
.durum.ok{color:var(--yesil);font-weight:600}
.seviyeler{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
@media(max-width:640px){.seviyeler{grid-template-columns:1fr}}
.sev{background:#f8fafc;border-radius:11px;padding:7px 8px}
.sev small{display:block;font-size:11.5px;font-weight:700;color:var(--soluk);margin-bottom:5px;letter-spacing:.3px}
.sevBtnlar{display:flex;gap:4px}
.sevBtnlar button{flex:1;border:1px solid var(--cizgi);background:#fff;border-radius:8px;padding:6px 2px;font-size:12.5px;font-weight:600;color:var(--soluk)}
.sevBtnlar button.s1.aktif{background:#fff7ed;border-color:#fb923c;color:#c2410c}
.sevBtnlar button.s2.aktif{background:#eff6ff;border-color:#60a5fa;color:#1d4ed8}
.sevBtnlar button.s3.aktif{background:#f0fdf4;border-color:#4ade80;color:#15803d}
.gorusMetin{width:100%;min-height:96px;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;line-height:1.55;resize:vertical;font-size:15px}
.gorusAlt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.sayac{font-size:12px;color:var(--soluk)}
.sayac.uzun{color:var(--turuncu);font-weight:600}

/* Takip */
.matris{overflow:auto;border:1px solid var(--cizgi);border-radius:12px;background:#fff}
.matris table{border-collapse:collapse;font-size:13px;min-width:100%}
.matris th,.matris td{border-bottom:1px solid #f1f5f9;padding:7px 8px;text-align:center;white-space:nowrap}
.matris th{background:#f8fafc;font-size:11.5px;color:var(--soluk);position:sticky;top:0}
.matris td:first-child,.matris th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.matris th:first-child{background:#f8fafc;z-index:2}
.tik{color:#16a34a;font-weight:800}
.eksik{color:#cbd5e1}
.ozetKutular{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ozet{background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px}
.ozet b{display:block;font-size:24px;color:var(--ana)}
.ozet span{font-size:12.5px;color:var(--soluk)}

/* Karne listesi */
.karneSatir{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f1f5f9}
.karneSatir:last-child{border-bottom:0}
.karneSatir .ad{flex:1;font-weight:600}
.rozet{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:#f1f5f9;color:var(--soluk)}
.rozet.tam{background:#dcfce7;color:#166534}
.rozet.yarim{background:#fef3c7;color:#92400e}
.onizlemeKap{background:#d6dbe3;border-radius:14px;padding:14px;overflow:hidden}
.olcek{transform-origin:top left}

/* Modal */
.perde{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.pencere{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.pencere.genis{max-width:980px}
.pencereUst{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.pencereUst h3{margin:0;color:var(--ana);font-size:17px}
.cumleGrup{margin-bottom:12px}
.cumleGrup b{font-size:12.5px;color:var(--soluk);display:block;margin-bottom:6px;letter-spacing:.3px}
.cumle{display:block;width:100%;text-align:left;border:1px solid var(--cizgi);background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:14px;line-height:1.45;color:var(--yazi)}
.cumle:hover{border-color:var(--altin);background:#fffdf7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.adim{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.adim i{font-style:normal;background:var(--krem);color:var(--ana);font-weight:800;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.adim p{margin:3px 0 0;font-size:14px;line-height:1.5}
.karsilamaKafa{background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;border-radius:16px;padding:18px;margin:-4px -4px 6px;position:relative;overflow:hidden}
.karsilamaKafa h2{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:23px}
.karsilamaKafa p{margin:6px 0 0;opacity:.85;font-size:14px}
.siteKatman{position:fixed;inset:0;z-index:300;background:#fff;display:flex;flex-direction:column}
.siteKatman .sUst{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--cizgi);align-items:center}
.siteKatman iframe{flex:1;border:0;width:100%}
.cbRozet{position:fixed;left:10px;top:10px;z-index:60;font-size:11px;background:rgba(255,255,255,.8);border:1px solid var(--cizgi);border-radius:99px;padding:3px 8px;color:var(--soluk)}

/* Çocuk Boyu (akıllı tahta): dokunulan her şey alta iner */
body.cocukBoyu .ust{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-top:1px solid var(--cizgi);border-bottom:0;padding-bottom:8px}
body.cocukBoyu #app{padding-top:14px;padding-bottom:150px}
body.cocukBoyu .perde{align-items:flex-end}
body.cocukBoyu .pencere{max-height:62vh}
body.cocukBoyu .toast{bottom:130px}

/* ================= KARNE (A4) ================= */
.karne{--c2a:rgba(184,137,59,.45);--c2b:rgba(184,137,59,.3);--c1:#1e3a5f;--c2:#b8893b;--c3:#f6f1e6;--c4:#fbf9f4;--fs:10.6px;width:210mm;height:297mm;position:relative;background:#fff;overflow:hidden;color:#1f2937;font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.karne.t-bordo{--c1:#7a1f2b;--c2:#b8893b;--c3:#f8efe9;--c4:#fcf8f5}
.karne.t-zumrut{--c1:#14532d;--c2:#b8893b;--c3:#eef5ee;--c4:#f8fbf7}
.karne.t-mor{--c1:#3b2a6b;--c2:#c09a4a;--c3:#f1eef8;--c4:#f9f8fc}
.karne .kCer1{position:absolute;inset:6mm;border:2.4px solid var(--c1);border-radius:2mm}
.karne .kCer2{position:absolute;inset:8.2mm;border:.9px solid var(--c2);border-radius:1.4mm}
.karne .kKose{position:absolute;width:15mm;height:15mm;color:var(--c2)}
.karne .kKose.k1{left:4.2mm;top:4.2mm}.karne .kKose.k2{right:4.2mm;top:4.2mm;transform:scaleX(-1)}
.karne .kKose.k3{left:4.2mm;bottom:4.2mm;transform:scaleY(-1)}.karne .kKose.k4{right:4.2mm;bottom:4.2mm;transform:scale(-1,-1)}
.karne .kFiligran{position:absolute;left:50%;top:54%;width:120mm;height:120mm;transform:translate(-50%,-50%);opacity:.05;color:var(--c1)}
.karne.t-yesil{--c2a:rgba(139,195,74,.5);--c2b:rgba(139,195,74,.35);--c1:#2f7a3e;--c2:#8bc34a;--c3:#eff7ec;--c4:#f8fcf6}
.karne .kIc{position:absolute;inset:11mm 13mm 10mm;display:flex;flex-direction:column;overflow:hidden}
.karne .kIc>*{flex-shrink:0}
.karne .kIc>.kBosluk{flex-shrink:1}
.karne .kBas{display:grid;grid-template-columns:26mm 1fr 26mm;align-items:center;gap:3mm;padding-top:1mm}
.karne .kMuhur{width:23mm;height:23mm;color:var(--c1)}
.karne .kMuhur img{width:100%;height:100%;object-fit:contain}
.karne .kOkul{font-size:9.5px;letter-spacing:3.2px;font-weight:700;color:var(--c2);text-align:center;text-transform:uppercase}
.karne .kBaslik{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:27px;font-weight:800;color:var(--c1);text-align:center;letter-spacing:1.2px;line-height:1.1;margin:1.2mm 0 .8mm}
.karne .kAlt{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:12px;color:#475569;text-align:center}
.karne .kDonem{display:flex;justify-content:center;margin-top:2mm}
.karne .kDonem span{background:var(--c1);color:#fff;font-size:9px;font-weight:700;letter-spacing:1.6px;padding:1.1mm 4mm;border-radius:99px;text-transform:uppercase}
.karne .kFoto{width:25mm;height:25mm;border-radius:50%;justify-self:center;padding:1.1mm;background-color:var(--c2);background-image:conic-gradient(var(--c2),#f3e3b8,var(--c2),#f3e3b8,var(--c2));box-shadow:0 0 0 .5mm #fff inset}
.karne .kFoto img,.karne .kFoto span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;border:1mm solid #fff;background:var(--c3);color:var(--c1);font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:22px}
.karne .kOzet{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:3mm;padding:2mm 3mm;border:1px solid #ece6d8;border-radius:2mm;background:#fff}
.karne .kOzetU{display:flex;justify-content:space-between;font-size:8.2px;color:#475569;margin-bottom:1mm}.karne .kOzetU b{color:var(--c1);letter-spacing:.3px}.karne .kOzetU span{font-weight:700;color:var(--c2)}
.karne .kOzetC{height:1.6mm;background:#eef0f4;border-radius:99px;overflow:hidden}.karne .kOzetC i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c2),var(--c1))}
.karne .kIkon{font-style:normal;margin-right:1.3mm;font-size:calc(var(--fs) + 1px)}
.karne .kSag{text-align:center;font-size:8px;color:var(--c1);font-weight:700;letter-spacing:.6px;line-height:1.3}
.karne .kSag .kYil{font-family:"Playfair Display",Georgia,serif;font-size:15px;font-weight:800;display:block}
.karne .kBilgi{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.2fr;margin-top:4.5mm;background:var(--c3);border:1px solid var(--c2a);border-radius:2.2mm;overflow:hidden}
.karne .kBilgi div{padding:2.2mm 3mm;border-right:1px solid var(--c2b)}
.karne .kBilgi div:last-child{border-right:0}
.karne .kBilgi small{display:block;font-size:7.3px;font-weight:700;color:var(--c2);letter-spacing:1px;text-transform:uppercase}
.karne .kBilgi b{display:block;font-size:12.5px;color:var(--c1);margin-top:.6mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.karne .kBolum{display:flex;align-items:center;gap:3mm;margin:4.2mm 0 2.8mm;font-size:8.8px;font-weight:800;letter-spacing:2.2px;color:var(--c1);text-transform:uppercase}
.karne .kBolum::before,.karne .kBolum::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--c2),transparent)}
.karne .kIzgara{display:grid;grid-template-columns:1fr 1fr;gap:2.6mm}
.karne .kIzgara.tek{grid-template-columns:1fr}
.karne .kKart{--dr:var(--c2);background:#fff;border:1px solid var(--drC,#e5e7eb);border-left:3px solid var(--dr);border-radius:1.8mm;padding:0 0 2.2mm;break-inside:avoid;overflow:hidden}
.karne .kKart .kKartUst{background:var(--drA,#f8fafc);padding:1.5mm 3mm 1.3mm;margin-bottom:1.3mm;border-bottom:1px solid var(--drB,#eef2f7)}
.karne .kKart .kPiller,.karne .kKart .kMetin{padding:0 3mm}
.karne .kKart.genel{grid-column:1/-1;--dr:var(--c1);background:linear-gradient(135deg,var(--c3),#fff 70%)}
.karne .kKart.genel .kKartUst{background:transparent}
.karne .kKartUst{display:flex;justify-content:space-between;align-items:baseline;gap:2mm;margin-bottom:1mm}
.karne .kDers{font-size:calc(var(--fs) + .6px);font-weight:800;color:var(--dr,var(--c1))}
.karne .kOgr{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:calc(var(--fs) - .4px);color:#6b7280;white-space:nowrap}
.karne .kPiller{display:flex;gap:1.2mm;flex-wrap:wrap;margin:.6mm 0 1.2mm}
.karne .kPil{font-size:calc(var(--fs) - 3px);font-weight:700;border-radius:99px;padding:.35mm 2mm;letter-spacing:.2px}
.karne .p3{background:#dcfce7;color:#166534}.karne .p2{background:#dbeafe;color:#1e40af}.karne .p1{background:#ffedd5;color:#9a3412}
.karne .kMetin{font-size:var(--fs);line-height:1.47;color:#1f2937;text-align:justify;hyphens:auto}
.karne .kBosluk{flex:1;min-height:2mm}
.karne .kImzalar{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;margin-top:3mm;text-align:center}
.karne .kImza{border-top:1px solid #94a3b8;padding-top:1.4mm;font-size:9px;color:#334155}
.karne .kImza b{display:block;font-size:9.8px;color:var(--c1)}
.karne .kImza span{font-size:8px;color:#64748b;letter-spacing:.4px}
.karne .kAyak{display:flex;align-items:center;gap:3mm;margin-top:4mm;padding-top:2.4mm;border-top:1px solid #ece6d8}
.karne .kAyakYazi{flex:1;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:10.2px;color:#475569;line-height:1.4}
.karne .kAyakYazi b{font-style:normal;color:var(--c1)}
.karne .kEtiket{background:var(--c1);color:#fff;font-weight:800;font-size:8.6px;letter-spacing:2px;padding:1.6mm 3.4mm;border-radius:1.4mm;white-space:nowrap;position:relative}
.karne .kEtiket::after{content:"";position:absolute;inset:.7mm;border:.6px solid var(--c2);border-radius:1mm}
.karne .kRozet{width:19mm;height:19mm;color:var(--c2);flex:none}
.karne.kompakt .kPiller{display:none}
.karne .kDevam{display:flex;align-items:center;gap:3mm;padding-bottom:2mm;border-bottom:1px solid #ece6d8}
.karne .kDevam b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:15px;color:var(--c1);letter-spacing:.8px}
.karne .kDevam span{font-size:9.5px;color:#64748b}
.karne .kDevamNot{text-align:right;font-size:8.5px;font-style:italic;color:#64748b;margin-top:1.5mm;flex-shrink:0}
#onizOlcek .karne+.karne,#mOnizOlcek .karne+.karne{margin-top:6mm}
.karne.uzun{height:auto;min-height:297mm}
.karne.uzun .kCer1,.karne.uzun .kCer2,.karne.uzun .kKose,.karne.uzun .kFiligran{display:none}
.karne.uzun .kKart{break-inside:avoid;page-break-inside:avoid}
.karne.uzun .kIc{position:relative;inset:auto;margin:11mm 13mm 10mm}

function bosVeri(){return {ayar:varsayilanAyar(),ayarTs:0,siniflar:[],ogrenciler:[],gorusler:{},kts:{},meta:{},secim:{sinif:'',ogretmen:'',satir:''}};}
var DEPO='dkKarne2_',V,PK='';
function pkHesap(a){return sabitId(a.yil)+'_'+sabitId(a.donem);}

function yukle(){var ay=lsAl(DEPO+'ayar'),eski=lsAl(ANAHTAR);V=bosVeri();
  if(ay&&ay.ayar){V.ayar=ay.ayar;V.ayarTs=ay.ayarTs||0;V.secim=ay.secim||V.secim;}
  else if(eski&&eski.ayar){V.ayar=eski.ayar;V.secim=eski.secim||V.secim;}
  tamamlaAyar();PK=gorunenDonem()||pkHesap(V.ayar);donemYukle(PK,eski);}
function donemYukle(pk,eski){var arsiv=!!gorunenDonem(),d=lsAl(DEPO+'d_'+pk);
  if(!d&&eski&&eski.siniflar&&eski.siniflar.length&&pkHesap(eski.ayar||V.ayar)===pk)d=gocHazirla(eski);
  if(!d&&!arsiv){var son=lsAl(DEPO+'sonDonem'),o=(son&&son!==pk)?lsAl(DEPO+'d_'+son):null;

  V.siniflar=d?d.siniflar:[];V.ogrenciler=d?d.ogrenciler:[];V.gorusler=d?(d.gorusler||{}):{};V.kts=d?(d.kts||{}):{};V.goc=d?(d.goc||{}):{};

function gocHazirla(eski){var sMap={},oMap={},sinifAdi={};
  var siniflar=temiz(eski.siniflar).map(function(s){var yeni=/^s_/.test(s.id)?s.id:'s_'+sabitId(s.ad);sMap[s.id]=yeni;sinifAdi[yeni]=s.ad;s.id=yeni;return s;});
  var ogr=(eski.ogrenciler||[]).map(function(o){var sid=sMap[o.sinifId]||o.sinifId;var yeni=/^o_/.test(o.id)?o.id:(o.no?'o_'+sabitId(sinifAdi[sid]||'')+'_'+o.no:o.id);oMap[o.id]=yeni;return {id:yeni,sinifId:sid,ad:o.ad,no:o.no||''};});
  var ogrSinifi={};ogr.forEach(function(o){ogrSinifi[o.id]=o.sinifId;});
  var gor={};Object.keys(eski.gorusler||{}).forEach(function(k){var p=k.split('|'),oid=oMap[p[0]]||p[0],g=temiz(eski.gorusler[k]);if(!g.s)g.s=ogrSinifi[oid]||'';gor[oid+'|'+p[1]]=g;});
  var goc={};siniflar.forEach(function(s){goc[s.id]={kadro:temiz(s.kadro),ogr:ogr.filter(function(o){return o.sinifId===s.id;})};});
  return {siniflar:siniflar,ogrenciler:ogr,gorusler:gor,kts:{},goc:goc};}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function buyukTR(s){return String(s||'').toLocaleUpperCase('tr-TR');}
function sinifIlerleme(s){var ogr=sinifOgr(s.id),top=ogr.length*s.kadro.length,dolu=0;
  ogr.forEach(function(o){s.kadro.forEach(function(r){if(doluMu(gorus(o.id,r.id)))dolu++;});});return {dolu:dolu,top:top};}

function logoHTML(){return '<img src="'+(V.ayar.logo||DK_LOGO)+'" alt="Değişim Koleji" style="width:100%;height:100%;object-fit:contain;border-radius:50%">';}

function ciz(){
  var a=V.ayar,html='';
  html+='<div class="ust"><div class="ustSatir"><div class="logoMini" style="color:var(--ana)">'+logoHTML()+'</div>'+
    '<div class="ustBaslik"><b>Değişim Karnesi</b><span>'+esc(a.okul)+' · '+esc(V.meta.donem||a.donem)+' <span id="kayitDurum" style="color:#16a34a;font-weight:600"></span></span></div>'+
    '<button class="bulutRozet" id="bulutRozet" onclick="bulutTani()"></button>'+
    '<button class="ikonBtn" title="Sitedeki diğer çalışmalar" onclick="siteAc()">🏠</button>'+
    '<button class="ikonBtn" title="Ayarlar" onclick="sekmeGit(\'ayar\')">⚙️</button></div>'+
    '<div class="sekmeler">'+
    sekmeBtn('kurulum','🏫 Sınıflar & Öğrenciler')+sekmeBtn('gorus','✍️ Görüş Yaz')+sekmeBtn('takip','📊 Takip')+sekmeBtn('karne','🖨️ Karneler')+sekmeBtn('ayar','⚙️ Ayarlar')+
    '</div></div>'+(gorunenDonem()?'<div class="arsivBant">📚 Arşiv görüntüleniyor: <b>'+esc(V.meta.donem)+'</b> '+esc(V.meta.yil||'')+' <button class="btn kucuk" onclick="donemGoster(\'\')">Güncel döneme dön</button></div>':'')+
    (BULUT.yeniSurum?'<div class="arsivBant" style="background:#ecfdf5;border-color:#a7f3d0;color:#065f46">🔄 Bu sistemin daha yeni bir sürümü var (sürüm '+BULUT.yeniSurum+'). Gruptaki en güncel dosyayı açın — verileriniz bulutta, hiçbiri kaybolmaz.</div>':'')+
    '<div id="icerik"></div>';
  document.getElementById('app').innerHTML=html;bulutRozetGuncelle();
  var ic=document.getElementById('icerik');
  if(SEKME==='kurulum')ic.innerHTML=cizKurulum();
  else if(SEKME==='gorus')ic.innerHTML=cizGorus();
  else if(SEKME==='takip')ic.innerHTML=cizTakip();
  else if(SEKME==='karne'){ic.innerHTML=cizKarneler();onizlemeYenile();}
  else ic.innerHTML=cizAyar();
  if(SEKME==='gorus')gorusFiltre();
  cbRozet();
}
function sekmeBtn(id,ad){return '<button class="sekme'+(SEKME===id?' aktif':'')+'" onclick="sekmeGit(\''+id+'\')">'+ad+'</button>';}
function sekmeGit(id){SEKME=id;ciz();window.scrollTo({top:0});}
function cizKoru(){var y=window.scrollY;ciz();window.scrollTo(0,y);}

function sinifCipleri(fn,secili,ilerlemeGoster){
  if(!V.siniflar.length)return '';
  return '<div class="cipler" style="margin-bottom:12px">'+V.siniflar.map(function(s){
    var ek='';if(ilerlemeGoster){var p=sinifIlerleme(s);ek='<span class="say">'+(p.top?Math.round(p.dolu/p.top*100):0)+'%</span>';}
    else ek='<span class="say">'+sinifOgr(s.id).length+'</span>';
    return '<button class="cip'+(s.id===secili?' aktif':'')+'" onclick="'+fn+'(\''+s.id+'\')">'+esc(s.ad)+ek+'</button>';}).join('')+'</div>';
}
function seciliSinif(){var s=sinifBul(V.secim.sinif);if(!s&&V.siniflar.length){s=V.siniflar[0];V.secim.sinif=s.id;}return s;}
function sinifSec(id){V.secim.sinif=id;kaydet(true);ciz();}

/* ================= 1) KURULUM ================= */
function cizKurulum(){
  var h='<div class="kart"><h2>🏫 Sınıflar</h2><p class="aciklama">Tüm şubeler e-Okul listesiyle yüklü. Buradaki değişiklikler (kadro, öğrenci) buluta kaydedilir ve tüm öğretmenlerde görünür.</p>'+
    '<div class="satir"><input class="gir" id="yeniSinif" placeholder="Örn: 4A" style="max-width:180px" onkeydown="if(event.key===\'Enter\')sinifEkle()">'+
    '<button class="btn" onclick="sinifEkle()">＋ Sınıf Ekle</button>'+
    '</div>'+
    '<div class="ipucu" style="margin:14px 0 0;background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a">📄 <b>e-Okul sınıf listesi (PDF) varsa en kolayı bu:</b> PDF’i seçin, sistem tüm şubeleri, öğrenci adlarını ve numaralarını kendisi ekler. Yeni öğrenci gelince güncel PDF’i tekrar yükleyin — yalnızca <b>yeni gelenler</b> eklenir, yazılmış görüşler korunur.'+
    '<div style="margin-top:10px"><label class="btn" style="cursor:pointer">📄 e-Okul PDF listesi yükle<input type="file" accept="application/pdf,.pdf" multiple hidden onchange="eokulPdf(this)"></label></div></div></div>';
  if(!V.siniflar.length){
    h+='<div class="kart bos"><div class="buyuk">🎓</div><p><b>Sınıflar buluttan yükleniyor…</b><br>İnternet bağlantısını kontrol edin. Gerekirse yukarıdan sınıf ekleyebilirsiniz.</p></div>';
    return h;}
  var s=seciliSinif();
  h+=sinifCipleri('sinifSec',s.id,false);
  var ogr=sinifOgr(s.id);
  h+='<div class="kart"><div class="satir" style="justify-content:space-between"><h2 style="margin:0">'+esc(s.ad)+' sınıfı</h2>'+
     '<div class="satir"><button class="btn kucuk cizgili" onclick="sinifYenidenAdlandir(\''+s.id+'\')">✏️ Adını değiştir</button><button class="btn kucuk kirmizi" onclick="sinifSil(\''+s.id+'\')">🙈 Listeden kaldır</button></div></div></div>';
  h+='<div class="iki"><div class="kart"><h3>👩‍🏫 Öğretmen kadrosu ('+s.kadro.length+')</h3><p class="aciklama">Bu sınıfa giren dersler ve öğretmenler. Karnedeki sıra bu sıradır. Sınıf öğretmeni görüşü karnede “Genel Değerlendirme” olarak en üstte, geniş görünür.</p>'+
    '<table class="tablo"><tr><th>Ders</th><th>Öğretmen</th><th></th></tr>'+
    s.kadro.map(function(r,i){return '<tr><td><input value="'+esc(r.ders)+'" onchange="kadroDegis(\''+s.id+'\','+i+',\'ders\',this.value)"></td>'+
      '<td><input value="'+esc(r.ogretmen)+'" placeholder="Öğretmen adı" onchange="kadroDegis(\''+s.id+'\','+i+',\'ogretmen\',this.value)"></td>'+
      '<td style="white-space:nowrap"><button class="sil" title="Yukarı" onclick="kadroTasi(\''+s.id+'\','+i+',-1)">↑</button><button class="sil" title="Sil" onclick="kadroSil(\''+s.id+'\','+i+')">✕</button></td></tr>';}).join('')+
    '</table><div class="satir" style="margin-top:10px"><button class="btn kucuk" onclick="kadroEkle(\''+s.id+'\')">＋ Ders ekle</button>'+
    '<button class="btn kucuk acik" onclick="kadroHepsine(\''+s.id+'\')">📋 Bu kadroyu tüm sınıflara uygula</button></div></div>';
  h+='<div class="kart"><h3>🧒 Öğrenciler ('+ogr.length+')</h3>'+

function satirCoz(satir){
  satir=satir.replace(/\r/g,'').trim();if(!satir)return null;
  if(/^(s\.?\s*)?(no|numara|okul no|ad|adı|ad soyad|adı soyadı|öğrenci|öğrenci adı|isim|sıra)([\s\t;,]+(no|numara|ad|adı|soyad|soyadı|ad soyad|adı soyadı|öğrenci adı|isim|okul no))*$/i.test(satir))return null;
  var p=satir.split(/\t|;|,|\s{2,}/).map(function(x){return x.trim();}).filter(Boolean);
  var no='',ad='';
  if(p.length>=2){var sayiIdx=-1;p.forEach(function(x,i){if(sayiIdx<0&&/^\d{1,6}$/.test(x))sayiIdx=i;});
    if(sayiIdx>-1){no=p[sayiIdx];ad=p.filter(function(x,i){return i!==sayiIdx&&!/^\d+$/.test(x);}).join(' ');}else ad=p.join(' ');}
  else{var m=satir.match(/^(\d{1,6})[\s.\-)]+(.+)$/)||null;var m2=satir.match(/^(.+?)\s+(\d{1,6})$/)||null;
    if(m){no=m[1];ad=m[2];}else if(m2){ad=m2[1];no=m2[2];}else ad=satir;}
  ad=ad.replace(/\s+/g,' ').trim();
  if(!ad||/^(ad|adı|ad soyad|adı soyadı|öğrenci|isim)$/i.test(ad))return null;
  ad=ad.split(' ').map(function(k){return k.charAt(0).toLocaleUpperCase('tr-TR')+k.slice(1).toLocaleLowerCase('tr-TR');}).join(' ');
  return {ad:ad,no:no};
}

  var s=sinifBul(sid);V.ogrenciler.push({id:o.no?('o_'+sabitId(s.ad)+'_'+o.no):yeniId('o'),sinifId:sid,ad:o.ad,no:o.no});n++;}});V.kts[sid]=Date.now();kaydet();ciz();toast(n+' öğrenci eklendi.');}

var PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js';
var PDFJS_ISCI='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
function adDuzelt(s){return s.replace(/\s+/g,' ').trim().split(' ').map(function(k){var l=k.toLocaleLowerCase('tr-TR');return l.charAt(0).toLocaleUpperCase('tr-TR')+l.slice(1);}).join(' ');}
function eokulSatirlar(pdf){var sayfalar=[],i=1;
  return new Promise(function(coz,red){function sonraki(){if(i>pdf.numPages){coz(sayfalar);return;}
    pdf.getPage(i).then(function(pg){return pg.getTextContent();}).then(function(tc){
      var gruplar=[];tc.items.forEach(function(it){if(!it.str||!it.str.trim())return;var y=it.transform[5],x=it.transform[4];
        var g=gruplar.filter(function(gg){return Math.abs(gg.y-y)<3;})[0];if(!g){g={y:y,p:[]};gruplar.push(g);}g.p.push({x:x,w:it.width||0,s:it.str,h:Math.abs(it.transform[0])||8});});
      gruplar.sort(function(a,b){return b.y-a.y;});
      sayfalar.push(gruplar.map(function(g){g.p.sort(function(a,b){return a.x-b.x;});var out='',son=null;
        g.p.forEach(function(q){if(son){var bosluk=q.x-(son.x+son.w);out+=(bosluk>q.h*0.2)?' ':'';}out+=q.s;son=q;});
        return out.replace(/\s+/g,' ').trim();}));
      i++;sonraki();}).catch(red);}sonraki();});}
function eokulCoz(sayfalar){var siniflar=[],akt=null;
  sayfalar.forEach(function(satirlar){satirlar.forEach(function(l){
    var m=l.match(/(Ana\s*Sınıfı|(\d{1,2})\s*\.\s*Sınıf)\s*\/\s*([A-ZÇĞİÖŞÜ])\s*Şubesi/i);
    if(m){var ad=m[2]?(m[2]+m[3].toLocaleUpperCase('tr-TR')):('Ana Sınıfı '+m[3].toLocaleUpperCase('tr-TR'));
      akt=siniflar.filter(function(s){return s.ad===ad;})[0];if(!akt){akt={ad:ad,ogretmen:'',ogr:[]};siniflar.push(akt);}return;}
    if(!akt)return;
    var t=l.match(/Sınıf Öğretmeni\s*:\s*(.*?)\s*(Sınıf Başkanı|$)/i);if(t){if(t[1].trim())akt.ogretmen=adDuzelt(t[1]);return;}
    var o=l.match(/^(\d{1,3})\s+(\d{1,9})\s+(.+?)\s+(Erkek|Kız)\s*$/i);
    if(o&&!akt.ogr.some(function(x){return x.no===o[2];}))akt.ogr.push({no:o[2],ad:adDuzelt(o[3])});});});
  return siniflar.filter(function(s){return s.ogr.length;});}
function eokulPdf(inp){var dosyalar=[].slice.call(inp.files);inp.value='';if(!dosyalar.length)return;toast('PDF okunuyor…',1500);
  betikYukle(PDFJS,function(ok){if(!ok||!window.pdfjsLib){toast('PDF okuyucu yüklenemedi — internet bağlantısını kontrol edin.',4000);return;}
    var hepsi=[];
    isciHazirla().then(function(){return Promise.all(dosyalar.map(function(f){return f.arrayBuffer().then(function(b){return pdfjsLib.getDocument({data:b}).promise;}).then(eokulSatirlar).then(function(s){hepsi=hepsi.concat(eokulCoz(s));});}));})
    .then(function(){if(!hepsi.length){toast('Bu PDF’te e-Okul sınıf listesi bulunamadı.',4000);return;}eokulOnay(hepsi);})
    .catch(function(){toast('PDF okunamadı. Dosya bozuk ya da şifreli olabilir.',4000);});});}
var ISCI_URL=null;
function isciHazirla(){if(ISCI_URL)return Promise.resolve();
  /* Dosyadan (file://) açıldığında da çalışsın diye işçi betiği blob olarak kurulur */
  return fetch(PDFJS_ISCI).then(function(r){return r.text();}).then(function(t){ISCI_URL=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));pdfjsLib.GlobalWorkerOptions.workerSrc=ISCI_URL;})
    .catch(function(){pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_ISCI;});}
var EOKUL_BEKLEYEN=null;
function sinifSira(a,b){function k(x){var m=x.ad.match(/^(\d+)/);return x.ad.indexOf('Ana')===0?'0'+x.ad:(m?('1'+('0'+m[1]).slice(-2)+x.ad):'9'+x.ad);}return k(a).localeCompare(k(b),'tr');}
function eokulPlan(liste){return liste.map(function(s){var m=V.siniflar.filter(function(x){return x.ad.toLocaleLowerCase('tr-TR')===s.ad.toLocaleLowerCase('tr-TR');})[0];

function eokulOnay(liste){liste.sort(sinifSira);EOKUL_BEKLEYEN=liste;var plan=eokulPlan(liste),top=0,yeniTop=0;

  modal('<div class="pencereUst"><h3>📄 e-Okul listesi okundu</h3><button class="ikonBtn" onclick="kapatModal()">✕</button></div>'+
   '<p class="aciklama">'+plan.length+' şube, '+top+' öğrenci bulundu. <b>'+yeniTop+' yeni öğrenci</b> eklenecek. Var olan öğrenciler ve yazılmış görüşler değişmez.</p>'+
   '<table class="tablo"><tr><th>Şube</th><th>Listede</th><th>Eklenecek</th></tr>'+satir+'</table>'+
   '<p class="aciklama" style="margin-top:10px">💡 Turuncu “Listede yok” yazanlar e-Okul’da görünmeyen öğrencilerdir (nakil olmuş olabilir). Sistem onları silmez; isterseniz kendiniz silebilirsiniz. Yabancı isimlerde harf düzeltmesi gerekirse öğrenci adına dokunup düzeltebilirsiniz.</p>'+
   '<div class="satir" style="justify-content:flex-end"><button class="btn acik" onclick="kapatModal()">Vazgeç</button><button class="btn altin" onclick="eokulUygula()" '+(yeniTop||plan.some(function(p){return !p.mevcut;})?'':'disabled')+'>✓ '+yeniTop+' öğrenciyi ekle</button></div>');}
function eokulUygula(){var plan=eokulPlan(EOKUL_BEKLEYEN),n=0,yeniS=0,ilk=null;

  plan.forEach(function(p){var s=p.mevcut;if(!s&&BULUT.liste['s_'+sabitId(p.s.ad)]&&BULUT.liste['s_'+sabitId(p.s.ad)].gizli){geriGetir('s_'+sabitId(p.s.ad));geriGelen.push(p.s.ad);return;}

  if(ilk)V.secim.sinif=ilk.id;kaydet();kapatModal();ciz();toast('✓ '+n+' öğrenci eklendi'+(yeniS?', '+yeniS+' yeni şube açıldı':'')+'.'+(geriGelen.length?' Daha önce kaldırılmış '+geriGelen.join(', ')+' geri getirildi; yeni öğrenci varsa PDF’i bir kez daha yükleyin.':' Kadroları kontrol etmeyi unutmayın.'),5000);}

  var ak=sv.akademik||2,so=sv.sosyal||2,du=sv.duygusal||2;

  var parcalar=[c1];var dk=dersAnahtar(r.ders),genelMi=r.ders==='Sınıf Öğretmeni';

/* Sığdırma sırası: yazı 10,6→9 px · seviye etiketleri gizlenir · 8,6 px · olmazsa çerçeveli “devam” sayfasına bölünür (yazı 9,6 px, okunaklı) */
function karneSigdir(el){var ic=el.querySelector('.kIc');var fs=10.6;el.classList.remove('uzun','kompakt');el.style.setProperty('--fs',fs+'px');
  function tas(){return ic.querySelector('.kAyak')?karneTasiyor(ic):karneTasti(ic);}
  var say=0;while(tas()&&fs-0.2>=9.0&&say<40){fs-=.2;el.style.setProperty('--fs',fs.toFixed(1)+'px');say++;}
  if(tas()){el.classList.add('kompakt');while(tas()&&fs-0.2>=8.6&&say<60){fs-=.2;el.style.setProperty('--fs',fs.toFixed(1)+'px');say++;}}
  if(tas()){karneIkiSayfa(el);return false;}return true;}
function karneIkiSayfa(el){el.classList.remove('kompakt');el.style.setProperty('--fs','9.6px');
  var ic1=el.querySelector('.kIc'),imza=ic1.querySelector('.kImzalar'),ayak=ic1.querySelector('.kAyak');
  var ad=(ic1.querySelector('.kBilgi b')||{}).textContent||'',sinif=(ic1.querySelectorAll('.kBilgi b')[2]||{}).textContent||'';

  ic2.innerHTML='<div class="kDevam"><div class="kMuhur" style="width:14mm;height:14mm">'+logoHTML()+'</div><div><b>ÖĞRENCİ DEĞİŞİM KARNESİ</b><span>'+esc(ad)+' · '+esc(sinif)+' · devam</span></div></div>'+

  imza.remove();ayak.remove();
  var not=document.createElement('div');not.className='kDevamNot';not.textContent='Görüşlerin devamı arka sayfadadır →';ic1.appendChild(not);
  var izg=ic1.querySelectorAll('.kIzgara'),g1=izg[izg.length-1],g2=ic2.querySelector('.kIzgara');
  var say=0;while(karneTasti(ic1)&&g1.children.length>1&&say<40){g2.insertBefore(g1.lastElementChild,g2.firstChild);say++;}

function birlestir(d){var n=0,gor={},harita={};
  if(d.tip==='dkKarneTam'){var v=d.veri;
    v.siniflar.forEach(function(s){var m=sinifBul(s.id)||V.siniflar.filter(function(x){return x.ad.toLocaleLowerCase('tr-TR')===s.ad.toLocaleLowerCase('tr-TR');})[0];

    v.ogrenciler.forEach(function(o){var sid=harita[o.sinifId]||o.sinifId;
      var e=V.ogrenciler.filter(function(x){return x.id===o.id||(x.sinifId===sid&&x.ad===o.ad);})[0];
      if(e)harita[o.id]=e.id;else{V.ogrenciler.push({id:o.id,sinifId:sid,ad:o.ad,no:o.no});V.kts[sid]=Date.now();}});

  return n;}

  if(!navigator.onLine){c='bek';t='📴 <span class="uzunYazi">Çevrimdışı · </span>cihazda';}

  else if(BULUT.durum!=='bagli'||!BULUT.listeHazir){t='☁️ Bağlanıyor…';}

function zamanOnce(ts){if(!ts)return 'henüz yok';var s=Math.round((Date.now()-ts)/1000);if(s<60)return s+' sn önce';if(s<3600)return Math.round(s/60)+' dk önce';return new Date(ts).toLocaleString('tr-TR');}

    satir(BULUT.okuHata?false:(BULUT.listeHazir?true:null),'Buluttan okuma',BULUT.okuHata||(BULUT.listeHazir?(sinifSay+' sınıf eşitlendi.'):'Bekleniyor…'))+
    satir(BULUT.yazHata?false:(BULUT.bekleyen?null:(BULUT.sonOk?true:null)),'Buluta yazma',BULUT.yazHata||(BULUT.bekleyen?BULUT.bekleyen+' kayıt gönderiliyor…':'Son başarılı eşitleme: '+zamanOnce(BULUT.sonOk)))+
    '<p class="aciklama" style="margin-top:12px">Hiçbir kayıt silinmez: bulutta dönem dönem arşivlenir, ayrıca bu cihazda da kopyası durur.</p>'+
    '<div class="satir" style="justify-content:flex-end"><button class="btn acik" onclick="kopyala(bulutRapor(),\'Durum kopyalandı — Barış Öğretmene gönderebilirsiniz.\')">📋 Durumu kopyala</button><button class="btn" onclick="bulutYenidenEsitle()">🔄 Şimdi eşitle</button></div>';
  modal(h);}

function cizBulutKart(){return '<div class="kart"><h2>☁️ Kayıt ve eşitleme</h2><p class="aciklama">Her görüş yazıldığı anda <b>bu cihaza</b> ve <b>okulun bulut veritabanına</b> kaydedilir. Hangi cihazdan yazılırsa yazılsın tüm öğretmenlerin ekranına düşer. Sistemde “kalıcı silme” yoktur: kaldırılan sınıf/öğrenci/ders bile bulutta saklanır, her dönem ayrı arşivlenir; yıllar sonra da açılabilir.</p>'+

function donemListesi(){var lst={};Object.keys(BULUT.donemler||{}).forEach(function(k){lst[k]=BULUT.donemler[k];});
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(DEPO+'d_')===0){var pk=k.slice((DEPO+'d_').length);if(!lst[pk]){var d=lsAl(k);lst[pk]=(d&&d.meta&&d.meta.donem)?d.meta:{donem:pk,yil:''};}}}}catch(e){}
  return lst;}
function cizArsivKart(){var lst=donemListesi(),aktif=pkHesap(V.ayar),gor=PK;
  var gizli=Object.keys(BULUT.liste||{}).filter(function(sid){return BULUT.liste[sid].gizli;});

      (pk===aktif?'<span class="rozet tam">Güncel dönem</span>':'')+(pk===gor?'<span class="rozet">Açık</span>':'<button class="btn kucuk acik" onclick="donemGoster(\''+(pk===aktif?'':pk)+'\')">Aç</button>')+'</div>';}).join('')+
    '<div class="satir" style="margin-top:12px"><button class="btn kucuk cizgili" onclick="yeniDonem()">🗓️ Yeni dönem başlat</button></div>'+
    (gizli.length?'<h3 style="margin-top:16px">🙈 Listeden kaldırılan sınıflar</h3>'+gizli.map(function(sid){return '<div class="karneSatir"><span class="ad">'+esc(BULUT.liste[sid].ad)+'</span><button class="btn kucuk" onclick="geriGetir(\''+sid+'\')">↩️ Geri getir</button></div>';}).join(''):'')+'</div>';}
function donemGoster(pk){try{if(pk)localStorage.setItem(DEPO+'gorunen',pk);else localStorage.removeItem(DEPO+'gorunen');}catch(e){}donemDegistir();window.scrollTo(0,0);}
function donemDegistir(){kaydet(true);PK=gorunenDonem()||pkHesap(V.ayar);V.secim.satir='';donemYukle(PK,null);kaydet(true);if(BULUT.db)donemAbone();ciz();}
function yeniDonem(){var ad=prompt('Yeni dönemin adı (örn: Haziran 2027):','');if(!ad||!ad.trim())return;
  var yil=(prompt('Eğitim öğretim yılı:',V.ayar.yil)||V.ayar.yil).trim();
  if(pkHesap({yil:yil,donem:ad.trim()})===pkHesap(V.ayar)){toast('Bu zaten güncel dönem.');return;}
  if(!confirm('“'+ad.trim()+'” dönemi başlatılsın mı?\n\nŞu anki dönemin bütün görüşleri arşivde kalır, hiçbiri silinmez. Sınıflar ve öğrenciler yeni döneme kopyalanır, görüş alanları boş başlar. Bu değişiklik TÜM öğretmenlerde geçerli olur.'))return;
  try{localStorage.removeItem(DEPO+'gorunen');}catch(e){}
  kaydet(true);var kopya={siniflar:temiz(V.siniflar),ogrenciler:temiz(V.ogrenciler)};
  V.ayar.donem=ad.trim();V.ayar.yil=yil;V.ayarTs=Date.now();PK=pkHesap(V.ayar);
  if(!lsAl(DEPO+'d_'+PK)){V.siniflar=kopya.siniflar;V.ogrenciler=kopya.ogrenciler;V.gorusler={};V.kts={};V.siniflar.forEach(function(s){V.kts[s.id]=Date.now();});}
  else donemYukle(PK,null);
  V.meta={yil:V.ayar.yil,donem:V.ayar.donem};V.secim.satir='';kaydet();if(BULUT.db)donemAbone();ciz();toast('🗓️ '+V.ayar.donem+' dönemi başladı. Önceki dönem arşivde.',4000);}
function geriGetir(sid){var L=BULUT.liste[sid];if(!L)return;if(!sinifBul(sid)){V.siniflar.push({id:sid,ad:L.ad,kadro:[]});V.siniflar.sort(sinifSira);}
  BULUT.listeBekleyen[sid]={ad:L.ad,gizli:false};BULUT.liste[sid]={ad:L.ad,gizli:false};sinifAbone(sid);kaydet();ciz();toast('↩️ '+L.ad+' geri getirildi.');}

/* ================= ÖĞRENCİ FOTOĞRAFLARI =================
   Görüşlerden tamamen ayrı tutulur: cihazda dkKarne2_foto, bulutta maas_config/k12_gk_foto_<sınıf> (döneme bağlı değil). */
var FOTO=lsAl(DEPO+'foto')||{},FOTO_BEK=lsAl(DEPO+'fotoBek')||{};
function fotoBekKaydet(){try{lsYaz(DEPO+'fotoBek',FOTO_BEK);}catch(e){}}
function fotoKaydetYerel(){try{lsYaz(DEPO+'foto',FOTO);}catch(e){toast('⚠️ Fotoğraf bu cihaza sığmadı; bulutta saklanıyor.',3500);}}
function avatarHTML(o,boy){boy=boy||34;var f=FOTO[o.id];return '<span class="avatar" style="width:'+boy+'px;height:'+boy+'px;font-size:'+Math.round(boy*.38)+'px">'+(f?'<img src="'+f+'" alt="">':esc(basHarf(o.ad)))+'</span>';}
function resimKucult(dosya,cb,hata){var r=new FileReader();r.onerror=function(){if(hata)hata();else toast('Dosya okunamadı.');};r.onload=function(){var img=new Image();img.onload=function(){
    var k=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=260;var x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,260,260);x.drawImage(img,(img.width-k)/2,Math.max(0,(img.height-k)/2-k*0.08),k,k,0,0,260,260);
    var q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>40000&&q>.4){q-=.08;d=c.toDataURL('image/jpeg',q);}cb(d);};
    img.onerror=function(){if(hata)hata();else toast('Bu dosya resim olarak açılamadı (iPhone HEIC ise JPG olarak kaydedip deneyin).',4500);};img.src=r.result;};r.readAsDataURL(dosya);}
function fotoAta(oid,veri){var o=V.ogrenciler.filter(function(x){return x.id===oid;})[0];if(!o)return;FOTO[oid]=veri;FOTO_BEK[oid]=o.sinifId;fotoKaydetYerel();fotoBekKaydet();fotoGonder();}
function fotoSec(oid){var i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=function(){if(!i.files[0])return;resimKucult(i.files[0],function(d){fotoAta(oid,d);cizKoru();toast('📷 Fotoğraf eklendi.');});};i.click();}
function fotoKaldir(oid){if(!confirm('Bu öğrencinin fotoğrafı kaldırılsın mı?'))return;fotoAta(oid,'');cizKoru();}
function fotoToplu(inp,sid){var dosyalar=[].slice.call(inp.files);inp.value='';var ogr=sinifOgr(sid),eslesmedi=[],plan={},say=0;
  function norm(t){return sabitId(t);}
  dosyalar.forEach(function(f){var ad=f.name.replace(/\.[^.]+$/,''),n=norm(ad),o=null;
    if(/^\d{1,6}$/.test(ad.replace(/[\s_\-]/g,'')))o=ogr.filter(function(x){return x.no&&x.no===ad.replace(/[\s_\-]/g,'');})[0];
    if(!o)o=ogr.filter(function(x){return norm(x.ad)===n;})[0];
    if(!o&&n.length>=4){var aday=ogr.filter(function(x){return norm(x.ad).indexOf(n)>-1||n.indexOf(norm(x.ad))>-1;});if(aday.length===1)o=aday[0];}
    if(!o){eslesmedi.push(f.name);return;}
    if(plan[o.id]){plan[o.id].cift=true;plan[o.id].adlar.push(f.name);return;}
    plan[o.id]={o:o,f:f,adlar:[f.name],cift:false};});
  var isler=Object.keys(plan).map(function(k){return plan[k];}).filter(function(p){if(p.cift){eslesmedi=eslesmedi.concat(p.adlar.map(function(a){return a+' (aynı öğrenciye birden çok dosya)';}));return false;}return true;});
  var i=0;(function sonraki(){if(i>=isler.length){cizKoru();toast('📷 '+say+' fotoğraf eklendi'+(eslesmedi.length?' · eşleşmeyen: '+eslesmedi.join(', '):'')+'. Eşleşmeyenleri öğrencinin resmine dokunarak tek tek ekleyebilirsiniz.',7000);return;}
    var p=isler[i++];resimKucult(p.f,function(d){fotoAta(p.o.id,d);say++;sonraki();},function(){eslesmedi.push(p.f.name+' (açılamadı)');sonraki();});})();}
function fotoGonder(){if(BULUT.durum!=='bagli'||!BULUT.db)return;var grup={};Object.keys(FOTO_BEK).forEach(function(oid){var sid=FOTO_BEK[oid];(grup[sid]=grup[sid]||{})[oid]=FOTO[oid]||'';});
  Object.keys(grup).forEach(function(sid){var paket=grup[sid];Object.keys(paket).forEach(function(oid){delete FOTO_BEK[oid];});
    yaz('foto_'+sid,{f:paket,ts:Date.now()},function(){Object.keys(paket).forEach(function(oid){FOTO_BEK[oid]=sid;});fotoBekKaydet();}).then(fotoBekKaydet);});}
function fotoAbone(sid){var key='f_'+sid;if(!BULUT.db||BULUT.abone[key])return;
  BULUT.abone[key]=BULUT.F.onSnapshot(bRef('foto_'+sid),function(sn){if(sunucuYok(sn)||!sn.exists())return;var f=(sn.data()||{}).f||{},degisti=false;
    Object.keys(f).forEach(function(oid){if(FOTO_BEK[oid])return;if((FOTO[oid]||'')!==(f[oid]||'')){FOTO[oid]=f[oid]||'';degisti=true;}});
    if(degisti){fotoKaydetYerel();bulutCizPlanla();}},dinleyiciHata(key,function(){if(sinifBul(sid))fotoAbone(sid);}));}

/* ================= ÖRNEK KARNE GÖRSELİ (gruba paylaşmak için; gerçek öğrenci bilgisi içermez) ================= */
var ORNEK_METIN={
  'sınıf öğretmeni':'Örnek, sınıfımızın neşeli ve sorumluluk sahibi öğrencilerinden biri. Derslere hazırlıklı geliyor, arkadaşlarıyla uyumlu ve yardımsever. Okuma alışkanlığı her geçen gün gelişiyor. Bu güzel çabasının devamını diliyor, kendisiyle gurur duyuyorum.',
  'beden':'Örnek, beden eğitimi derslerinde takım oyunlarına istekle katılıyor, kurallara uyuyor ve arkadaşlarını cesaretlendiriyor. Koordinasyon becerileri her derste gelişiyor.',
  'matematik':'Örnek, matematik derslerinde işlem becerilerini güzel kullanıyor ve problem çözerken farklı yollar deneyebiliyor. Düzenli tekrarlarla hızı ve doğruluğu daha da artacaktır.',
  'ingilizce':'Örnek, İngilizce derslerinde yeni kelimeleri kolayca öğreniyor ve etkinliklere istekle katılıyor. Kendini ifade etmeye çalışması çok değerli.',
  'speaking':'Örnek, speaking etkinliklerinde cesaretle söz alıyor; telaffuzu ve akıcılığı her derste biraz daha gelişiyor.',
  'sosyal':'Örnek, sosyal bilgiler derslerinde çevresini ve toplumu tanımaya ilgi duyuyor, fikirlerini rahatlıkla paylaşıyor.',
  'türkçe':'Örnek, Türkçe derslerinde okuduğunu anlama ve kendini ifade etme becerilerinde güzel bir gelişim gösteriyor. Kitap okumaya ilgisi takdire değer.',
  'fen':'Örnek, fen bilimleri derslerinde deney ve gözlem etkinliklerine büyük ilgi gösteriyor, merak ederek soru soruyor.'};
function ornekMetin(r,s,o,i){var d=(r.ders||'').toLocaleLowerCase('tr-TR');if(barisSatiri(r))return hazirGorus(o,s,i%10);
  for(var k in ORNEK_METIN){if(d.indexOf(k)>-1)return ORNEK_METIN[k];}return 'Örnek, '+r.ders.trim()+' derslerine istekle katılıyor, verilen görevleri özenle tamamlıyor ve arkadaşlarıyla uyumlu çalışıyor.';}
function ornekKarneGorsel(){var s=seciliSinif();if(!s){toast('Önce bir sınıf seçin.');return;}
  var o={id:'ornek_ogrenci',sinifId:s.id,ad:'Örnek Öğrenci',no:'000'},eklenen=[];
  /* geçici örnek görüşler: ts=0 olduğu için buluta ASLA gönderilmez; görsel alınınca hemen silinir */
  s.kadro.forEach(function(r,i){var k=gKey(o.id,r.id);if(V.gorusler[k])return;V.gorusler[k]={metin:ornekMetin(r,s,o,i),sev:{akademik:[3,3,2][i%3],sosyal:3,duygusal:[3,2][i%2]},ts:0,s:'ornek'};eklenen.push(k);});
  var kap=document.createElement('div');kap.style.cssText='position:fixed;left:-99999px;top:0;background:#fff';kap.innerHTML=karneHTML(o);document.body.appendChild(kap);
  eklenen.forEach(function(k){delete V.gorusler[k];});
  var el=kap.firstChild;karneSigdir(el);var sayfalar=[].slice.call(kap.querySelectorAll('.karne'));
  toast('🖼️ Örnek karne görseli hazırlanıyor…',2500);
  betikYukle('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',function(ok){
    if(!ok||!window.html2canvas){kap.remove();toast('Görsel için internet gerekli. İsterseniz örneği PDF olarak yazdırabilirsiniz.',4500);return;}
    var bekle=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
    bekle.then(function(){return html2canvas(sayfalar[0],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});}).then(function(c){
      kap.remove();c.toBlob(function(b){var ad='Ornek_Degisim_Karnesi.png';
        try{var f=new File([b],ad,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Öğrenci Değişim Karnesi – örnek'}).catch(function(){});return;}}catch(e){}
        var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=ad;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);
        toast('✓ Örnek karne görseli indirildi — gruba paylaşabilirsiniz.',4000);},'image/png');
    }).catch(function(){kap.remove();toast('Görsel oluşturulamadı. Örneği PDF olarak yazdırabilirsiniz.',4500);});});}
